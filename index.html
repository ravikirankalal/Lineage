<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#266955" />
    <meta name="description" content="Remember the people in your life and trace your family lineage." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />

    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" /></noscript>
    <title>Lineage</title>
    <style>html,body{background:#fafaf9}@media (prefers-color-scheme:dark){html,body{background:#0c0a09}}</style>
  </head>
  <body>
    <!-- Shown the moment the page arrives, until the app has started (it replaces this). -->
    <div id="root"><div style="min-height:100dvh;display:flex;align-items:center;justify-content:center"><img src="./icon.svg" alt="" width="64" height="64" style="border-radius:14px" /></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
