name: Deploy to Firebase

# Builds the app with the public Firebase web config (repo *variables*, not secrets) and deploys
# Hosting, plus Firestore rules and indexes when they changed. Skips cleanly until the
# FIREBASE_SERVICE_ACCOUNT secret is set. See FIREBASE_SETUP.md.
#
# Kept fast (owner, 2026-11-15): node_modules is cached by package-lock.json; the unit tests run in a
# parallel job (they already pass in `npm run verify` before every merge), so they don't hold up the
# deploy; rules and indexes deploy only when firestore.rules / firestore.indexes.json change (a
# manual run deploys everything); one Firebase CLI call, the version pinned in package-lock.json.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID || 'lineage-d575c' }}
    steps:
      - name: Check Firebase deploy is configured
        id: check
        env:
          HAS_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
        run: |
          if [ "$HAS_SERVICE_ACCOUNT" != "true" ]; then
            echo "::notice::FIREBASE_SERVICE_ACCOUNT secret not set; skipping Firebase deploy (see FIREBASE_SETUP.md)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$VITE_FIREBASE_PROJECT_ID" ]; then
            echo "::error::Set the VITE_FIREBASE_PROJECT_ID repository variable (web config comes from .env.production) (Settings > Secrets and variables > Actions > Variables)."
            exit 1
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.enabled == 'true'
        with:
          fetch-depth: 2 # the merge commit and its parent, to see whether the rules changed

      - uses: actions/setup-node@v4
        if: steps.check.outputs.enabled == 'true'
        with:
          node-version: 22

      - name: Restore node_modules
        id: nm
        if: steps.check.outputs.enabled == 'true'
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - run: npm ci --no-audit --no-fund
        if: steps.check.outputs.enabled == 'true' && steps.nm.outputs.cache-hit != 'true'

      - run: npm run build
        if: steps.check.outputs.enabled == 'true'

      - name: Deploy
        if: steps.check.outputs.enabled == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          ONLY=hosting
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || ! git rev-parse -q --verify HEAD~1 >/dev/null \
            || ! git diff --quiet HEAD~1 HEAD -- firestore.rules firestore.indexes.json; then
            ONLY=hosting,firestore
          fi
          echo "Deploying: $ONLY"
          SA_FILE="$RUNNER_TEMP/firebase-sa.json"
          trap 'rm -f "$SA_FILE"' EXIT
          umask 077
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$SA_FILE"
          export GOOGLE_APPLICATION_CREDENTIALS="$SA_FILE"
          # The firebase-tools pinned in package-lock.json (devDependency), never a fresh download.
          npx --no-install firebase deploy --only "$ONLY" --project "$VITE_FIREBASE_PROJECT_ID" --non-interactive

  # The unit tests, alongside the deploy (not before it). A failure here shows on the commit.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore node_modules
        id: nm
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
      - run: npm ci --no-audit --no-fund
        if: steps.nm.outputs.cache-hit != 'true'
      - run: npm test
